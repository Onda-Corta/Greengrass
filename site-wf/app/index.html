<!-- Apply the saved colour mode before first paint, so a dark page never flashes white. -->
<script>
  (function () {
    var m;
    try { m = (JSON.parse(localStorage.getItem('gg-app-v1') || '{}') || {}).theme; } catch (e) {}
    if (m !== 'dark' && m !== 'light') m = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-color-mode', m);
  })();
</script>
